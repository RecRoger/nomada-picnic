<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  <p [innerHTML]="data.text"></p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button mat-dialog-close>{{data.deny}}</button>
  <button mat-flat-button [mat-dialog-close]="onAccept()">{{data.accept}}</button>
</mat-dialog-actions>
