<p>{{ 'CALCULATOR.BASICS.EVENT' | translate }}</p>
@if (form) {
<form class="basic-form" [formGroup]="form">
  <app-form-control [control]="form.get('event') | asFormControl"
    label="{{ 'CALCULATOR.BASICS.EVENT_PLACEHOLDER' | translate }}" type="text">
  </app-form-control>

  <app-form-control [control]="form.get('guestsAmount') | asFormControl"
    label="{{ 'COMMON.GUESTS_NUMBER' | translate }}" type="number">
  </app-form-control>

  <app-form-control [control]="form.get('date') | asFormControl" label="{{ 'COMMON.DATE' | translate }}" type="date">
  </app-form-control>
  
  @if(this.places$ | async) {
  <app-form-control [control]="form.get('place') | asFormControl" label="{{ 'COMMON.PLACE' | translate }}" type="select"
    [options]="placeList">
  </app-form-control>
  } 
  

</form>
}
