@if (control) {
<mat-form-field>
  <mat-label>{{ label }}</mat-label>
  <input matInput [type]="type" [formControl]="control">

  @if (control.hasError('email') && !control.hasError('required')) {
  <mat-error>Campo invalido</mat-error>
  }
  @if (control.hasError('required')) {
  <mat-error>Campo <strong>required</strong></mat-error>
  }
</mat-form-field>
}
