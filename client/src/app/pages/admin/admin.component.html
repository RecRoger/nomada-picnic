<div class="c-admin page-container">
  <h2 class="c-admin--title">{{ "ADMIN.TITLE" | translate: user }}</h2>
  <h4 class="c-admin--subtitle">{{ "ADMIN.WELCOME" | translate: user }}</h4>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel">
    @for (tab of tabs; track $index) {
      <a
        mat-tab-link
        [routerLink]="tab.link"
        (click)="activeLinkIndex = $index"
        [active]="activeLinkIndex === $index"
      >
        {{ tab.label | translate }}
      </a>
    }
  </nav>
  <mat-tab-nav-panel #tabPanel>
    <div class="c-admin--container">
      <router-outlet></router-outlet>
    </div>
  </mat-tab-nav-panel>
</div>
