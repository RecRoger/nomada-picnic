<section class="c-hero">
  <div class="c-hero--media">
    <img src="assets/images/home_image.jpg" alt="Experiencia Nómada Picnic">
  </div>
  
  <div class="c-hero--content">
    <h1>{{ 'PUBLIC.HERO.TITLE' | translate }}</h1>
    <p>{{ 'PUBLIC.HERO.DESCRIPTION' | translate }}</p>
  </div>
  
  
  <div class="waves-container">
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
      <defs>
        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
      </defs>
      <g class="parallax">
        <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7" />
        <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
        <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
        <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
      </g>
    </svg>
  </div>
  
  @if (nextSection) {
    <button mat-fab class="c-hero--arrow" (click)="scrollToNext(nextSection)">
      <mat-icon>expand_more</mat-icon>
    </button>
  }
</section>
